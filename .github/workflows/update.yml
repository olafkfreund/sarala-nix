name: Update

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # UPDATE_TOKEN, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not trigger CI.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.UPDATE_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Update inputs and Sarala
        id: bump
        run: |
          nix flake update
          old=$(nix eval --raw .#sarala.version)
          nix run nixpkgs#nix-update -- --flake sarala
          new=$(nix eval --raw .#sarala.version)
          if [ "$old" = "$new" ]; then
            echo "title=chore: update flake inputs" >> "$GITHUB_OUTPUT"
          else
            echo "title=sarala: $old -> $new" >> "$GITHUB_OUTPUT"
          fi
      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          token: ${{ secrets.UPDATE_TOKEN }}
          branch: auto/update
          delete-branch: true
          title: ${{ steps.bump.outputs.title }}
          commit-message: ${{ steps.bump.outputs.title }}
          body: Automated daily update. Merges itself once CI passes.
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
